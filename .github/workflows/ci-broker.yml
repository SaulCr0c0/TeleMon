name: CI Broker

on:
  pull_request:
    branches: [main]
    paths:
      - "broker-mqtt/**"
      - ".github/workflows/ci-broker.yml"
  push:
    branches: [main]
    paths:
      - "broker-mqtt/**"

jobs:
  probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./broker-mqtt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sintaxis
        run: python -m py_compile *.py

      - name: Pruebas
        run: python -m unittest discover -s pruebas -t . -v

      - name: Imagen Docker
        run: docker build -t broker-propio .
