# Stack de TeleMon. Cada servicio se agrega en su rama y sprint correspondiente:
#   broker     -> Eclipse Mosquitto (Sprint 1) / broker propio (Sprint 2), puerto 1883
#   nodered    -> backend Node-RED (Sprint 2), puerto interno 1880
#   postgres   -> PostgreSQL 17 (Sprint 2), puerto interno 5432, volumen postgres_datos
#   proxy_web  -> Nginx (Sprint 3), puertos 80 y 443
# Solo se publican al exterior los puertos 1883, 80 y 443.

name: telemon

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: broker
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_USER_ESP32: ${MQTT_USER_ESP32}
      MQTT_PASS_ESP32: ${MQTT_PASS_ESP32}
      MQTT_USER_NODERED: ${MQTT_USER_NODERED}
      MQTT_PASS_NODERED: ${MQTT_PASS_NODERED}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    networks:
      - red_telematica

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - postgres_datos:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - red_telematica

  nodered:
    build: ./nodered
    container_name: nodered
    restart: unless-stopped
    environment:
      TZ: America/La_Paz
      MQTT_USER: ${MQTT_USER_NODERED}
      MQTT_PASS: ${MQTT_PASS_NODERED}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./nodered/data:/data
    depends_on:
      broker:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - red_telematica

networks:
  red_telematica:
    driver: bridge

volumes:
  postgres_datos:
