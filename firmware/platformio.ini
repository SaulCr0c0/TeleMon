; Firmware del nodo ESP32 de TeleMon
; Compilar: pio run   ·   Cargar: pio run -t upload   ·   Monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<diagnostico.cpp>
lib_deps =
    knolleary/PubSubClient@^2.8
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    bblanchon/ArduinoJson@^7.0.4

[env:diagnostico]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_src_filter = -<*> +<diagnostico.cpp>
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
