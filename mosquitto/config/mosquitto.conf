# Eclipse Mosquitto — broker base del proyecto TeleMon (Sprint 1)

# Puerto MQTT 3.1.1 sin TLS (decisión del informe: permite analizar paquetes y comparar latencias)
listener 1883

# Solo clientes con usuario y contraseña
allow_anonymous false
password_file /mosquitto/passwd

# Permisos por tema para cada usuario
acl_file /mosquitto/acl

# La telemetría es periódica: no se guardan mensajes en disco
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
